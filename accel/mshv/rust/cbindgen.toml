# configs/cbindgen.toml
language = "C"
include_guard = "MSHV_QEMU_BINDINGS_H"
documentation = true
includes = ["linux/types.h"]
header = """
// This file is generated by cbindgen.
"""

[export]
item_types = ["enums", "functions", "structs"]
# defined in src/x86_64/regs.rs
include = ["StandardRegisters", "SpecialRegisters", "SegmentRegister", "msr_entry"]
